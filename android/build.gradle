// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        // Kotlin 2.4 metadata (SumUp SDK) is newer than the R8 bundled with
        // AGP 8.13 reads; that R8 logs a warning per class and the build log
        // runs to megabytes. R8 9.3 understands it and stays quiet.
        classpath 'com.android.tools:r8:9.3.19'
        classpath 'com.google.gms:google-services:4.4.4'
        // SumUp merchant-sdk 7.x ships Kotlin 2.4 metadata
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.sumup.com/releases' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
