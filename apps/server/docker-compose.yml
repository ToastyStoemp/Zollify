# Run from the repo root:
#   docker compose -f apps/server/docker-compose.yml up -d --build
#
# Settings come from apps/server/.env, which is gitignored. Nothing in it is
# required for a first start: the signing secret is minted into the data
# volume and the first account registered becomes the owner.
services:
  zollify:
    container_name: zollify
    # In production the image comes from GHCR (built by .github/workflows/docker.yml)
    # and `deploy.sh --auto` pulls it; `up --build` still builds locally when wanted.
    image: ${ZOLLIFY_IMAGE:-ghcr.io/toastystoemp/zollify}:${ZOLLIFY_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    ports:
      - '127.0.0.1:8787:8787'
    volumes:
      # Named volume rather than a bind mount: the container runs unprivileged,
      # and a host directory would land root-owned on first start.
      - zollify-data:/data
      # Android APKs for self-update, fetched on the host by scripts/fetch-apks.mjs.
      - ./apk:/data/apk:ro
      # "Update server" drops a flag here; the host's zollify-deploy.path unit acts on it.
      - ./deploy:/data/deploy
    environment:
      # Optional: left empty, the server mints one on first start and keeps it in /data.
      ZOLLIFY_JWT_SECRET: ${ZOLLIFY_JWT_SECRET:-}
      # Terminated by the reverse proxy in front, which sets x-forwarded-proto.
      ZOLLIFY_REQUIRE_HTTPS: ${ZOLLIFY_REQUIRE_HTTPS:-1}
      ZOLLIFY_TRUST_PROXY: ${ZOLLIFY_TRUST_PROXY:-1}
      ZOLLIFY_ALLOWED_ORIGINS: ${ZOLLIFY_ALLOWED_ORIGINS:-}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    # Bounded so a crash loop cannot fill the disk with logs mid-convention.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  zollify-data:
